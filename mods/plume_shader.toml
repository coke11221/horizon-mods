name = "Plume Shader"
summary = "Raster-only Horizon shader with golden-hour sunlight, volumetric clouds, waving foliage, colored dynamic lighting, and planar water reflections."
description = """
Plume Shader (Beta) is a raster-only shader pack for Horizon (Shader API 0.2).

## Features
- **Sun, Sky & Clouds:** Golden-hour sunlight, directional sky palette, aerial perspective haze, crepuscular sun shafts, and volumetric clouds with altitude-based shapes and weather transitions.
- **Colored & Dynamic Lighting:** Colored volumetric block light (torches, lava, glowstone, and more) plus dynamic lighting from held and dropped light items.
- **Water & Reflections:** Clear water with depth tint, ripples, planar mirror reflections, and screen-space reflections (SSR) on water and wet/polished surfaces.
- **Foliage & Weather:** Waving foliage with shadow alignment and cave/distance attenuation, plus custom translucent rain and snow.
- **Post-Processing & Presets:** Linear-light bloom, optional spatial edge smoothing, and four tuned quality presets (**Lite**, **Balanced**, **High**, **Ultra**) with no slider clutter.
"""
